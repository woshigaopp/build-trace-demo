server:
  port: ${PORT:8080}

spring:
  application:
    name: buildtrace-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/buildtrace;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    async:
      request-timeout: 180s

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ai:
    base-url: ${APP_AI_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${APP_AI_API_KEY:}
    model: ${APP_AI_MODEL:Qwen/Qwen2.5-Coder-32B-Instruct}
    timeout: ${APP_AI_TIMEOUT:120s}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
